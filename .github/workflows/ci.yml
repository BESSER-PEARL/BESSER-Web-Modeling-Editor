name: CI

# Lint, unit tests, type check and build on every PR and push to develop/main.
# Node comes from .nvmrc (22, the version the production image builds on).

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned to commit SHAs (matches the BESSER repo's security policy).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint (errors fail, warnings are reported)
        run: npm run lint
      - name: Lint the library
        run: npm run lint --workspace=@besser/wme
      - name: OpenAPI types match the committed schema
        run: |
          npm run api:types --workspace=webapp
          git diff --exit-code -- packages/webapp/src/main/shared/api/generated/ \
            || { echo "::error::besser-openapi.d.ts is stale: run 'npm run api:types --workspace=webapp' and commit it."; exit 1; }

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit tests (vitest)
        run: npm test --workspace=webapp
      - name: Server tests (vitest)
        run: npm test --workspace=server
      - name: Library tests (vitest)
        run: npm test --workspace=@besser/wme

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The one error left is in packages/webapp/vitest.config.ts: vitest is typed
      # against the root vite (6.x, the library's pin), @vitejs/plugin-react against
      # the webapp's vite 7. The count may only go down.
      TSC_ERROR_BASELINE: 1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type check (no new errors)
        run: |
          npx tsc --noEmit -p packages/webapp/tsconfig.json > tsc.log || true
          errors=$(grep -c 'error TS' tsc.log || true)
          echo "TypeScript errors: $errors (baseline $TSC_ERROR_BASELINE)"
          if [ "$errors" -gt "$TSC_ERROR_BASELINE" ]; then
            grep 'error TS' tsc.log | tail -50
            echo "::error::$errors TypeScript errors, more than the baseline of $TSC_ERROR_BASELINE."
            exit 1
          fi
          if [ "$errors" -lt "$TSC_ERROR_BASELINE" ]; then
            echo "::notice::Down to $errors errors: lower TSC_ERROR_BASELINE in ci.yml."
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build (webapp + server)
        run: npm run build
      - name: Build the library (tsc -b + vite)
        run: npm run build --workspace=@besser/wme
