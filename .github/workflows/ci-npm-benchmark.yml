name: WME npm cache benchmark

on:
  push:
    branches: [codex/wme-ci-npm-benchmark]

permissions:
  contents: read

jobs:
  npm-cache:
    name: npm ci (${{ matrix.order }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        order: [baseline-first, offline-first]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Populate npm package cache
        run: npm ci --no-audit --no-fund
      - name: Run warm installs in alternating order
        env:
          ORDER: ${{ matrix.order }}
        run: |
          baseline() { time npm ci --no-audit --no-fund; }
          offline() { time npm ci --no-audit --no-fund --prefer-offline; }
          if [ "$ORDER" = baseline-first ]; then
            echo baseline; baseline
            echo prefer-offline; offline
          else
            echo prefer-offline; offline
            echo baseline; baseline
          fi
      - name: Verify lockfile and installed dependency tree
        run: |
          git diff --exit-code -- package-lock.json
          npm ls --all --json > "$RUNNER_TEMP/npm-installed.json"
