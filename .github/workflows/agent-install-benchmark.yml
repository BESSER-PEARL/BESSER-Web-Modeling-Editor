name: Modeling agent installer benchmark

on:
  push:
    branches: [codex/modeling-agent-ci-install-benchmark]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.installer }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_VERSION: '0.13.6'
    strategy:
      fail-fast: false
      matrix:
        installer: [pip, uv]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: BESSER-PEARL/modeling-agent
          ref: d84d94043336d9ac875061e9f6b9149637c60d8f
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: python
        with:
          python-version: '3.11'
          cache: ${{ matrix.installer == 'pip' && 'pip' || '' }}
          cache-dependency-path: requirements*.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.installer == 'uv'
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-${{ runner.arch }}-python-${{ steps.python.outputs.python-version }}-uv-${{ env.UV_VERSION }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt', 'pyproject.toml') }}
      - name: Install dependencies with pip
        if: matrix.installer == 'pip'
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
      - name: Install dependencies with uv
        if: matrix.installer == 'uv'
        run: |
          python -m pip install --disable-pip-version-check "uv==$UV_VERSION"
          uv pip install --system -r requirements-dev.txt -e .
      - name: Check out BESSER's LLM data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: BESSER-PEARL/BESSER
          ref: 4516f5e684b03c661b8eb6fdb2ac5d23df7e5a9
          path: .besser
          persist-credentials: false
          sparse-checkout: |
            besser/llm/data
            besser/spec_driven_agent/providers/data
      - name: Verify the BESSER data revision
        run: test "$(git -C .besser rev-parse HEAD)" = 4516f5e684b03c661b8eb6fdb2acb5d23df7e5a9
      - name: Run the unit tests
        env:
          BESSER_CHECKOUT: ${{ github.workspace }}/.besser
        run: python -m pytest tests -q --tb=short --ignore=tests/live
